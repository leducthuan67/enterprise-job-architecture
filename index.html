eGroup": "Nhân viên có kinh nghiệm", "examples": "Nhân viên vận hành kỹ thuật lành nghề; nhân viên nghiệp vụ xử lý công việc tương đối độc lập và giải quyết các tình huống phát sinh ngoài hướng dẫn chi tiết.", "scope": "• Thực hiện công việc tương đối độc lập trong phạm vi chuyên môn / nghiệp vụ được giao; tự tổ chức thứ tự và phương pháp thực hiện để đáp ứng yêu cầu về chất lượng, độ chính xác, tiến độ và an toàn.\n• Phân tích và xử lý được các tình huống phát sinh không thường lệ hoặc chưa có hướng dẫn chi tiết, dựa trên kiến thức, kinh nghiệm và phán đoán thực tế; lựa chọn phương án phù hợp trong giới hạn thẩm quyền.\n• Chủ động nhận diện nguyên nhân của sai lệch/vấn đề, quyết định biện pháp xử lý trong phạm vi được giao và chỉ báo cáo/escalate khi vấn đề vượt thẩm quyền, có rủi ro đáng kể hoặc cần quyết định của cấp trên.\n• Chịu trách nhiệm rõ ràng về kết quả đầu-cuối của phần việc được giao, bao gồm chất lượng, độ chính xác, tiến độ và việc xử lý các tình huống phát sinh; đề xuất cải tiến khi nhận thấy cơ hội.\n• Được giám sát chủ yếu thông qua mục tiêu và kết quả; không cần hướng dẫn thường xuyên về cách thức thực hiện. Có thể hướng dẫn nghiệp vụ cho nhân viên khác trong phạm vi công việc của mình.", "requirements": "- Kiến thức và kỹ năng: Kiến thức chuyên môn và kỹ năng thực hành thành thạo; có thể yêu cầu chứng chỉ chuyên môn hoặc chứng chỉ vận hành (thông thường là tốt nghiệp trung cấp nghề hoặc trình độ đào tạo cao hơn)\n\n- Kinh nghiệm: Kinh nghiệm thực tế đủ để thực hiện công việc độc lập và xử lý tình huống phát sinh (thông thường khoảng 2–3 năm, tùy thuộc vào tính chất công việc)", "mercerRef": "Experienced Para-Professional (S2)"}, {"track": "Employee", "pcRange": "42", "grade": 3, "titleGroup": "Nhân viên có kỹ năng nghiệp vụ", "examples": "Nhân viên vận hành kỹ thuật hoặc nghiệp vụ thực hiện nhiều bước công việc theo quy trình, phối hợp các hoạt động và xử lý các vấn đề thường gặp.", "scope": "• Thực hiện các công việc nghiệp vụ/kỹ thuật gồm nhiều bước theo quy trình, tiêu chuẩn và hướng dẫn đã thiết lập; tự sắp xếp các bước công việc thường lệ và phối hợp các hoạt động liên quan trong phạm vi được giao.\n• Tự thực hiện nhiệm vụ quen thuộc mà không cần hướng dẫn từng bước; bảo đảm chất lượng, độ chính xác và tiến độ của phần việc phụ trách.\n• Nhận biết và xử lý các vấn đề phát sinh thông thường theo quy trình hoặc phương án đã có; báo cáo cấp trên khi gặp tình huống bất thường, chưa có hướng dẫn hoặc vượt quá phạm vi thẩm quyền.\n• Chịu trách nhiệm về kết quả phần việc được giao, việc tuân thủ quy trình và phối hợp đúng các bước công việc; đóng góp vào hiệu quả của quy trình thông qua hạn chế sai sót và bảo đảm tiến độ.\n• Làm việc dưới sự giám sát định kỳ; kết quả được xem xét qua chất lượng, tiến độ, mức độ tuân thủ và khả năng xử lý đúng các vấn đề thường gặp.", "requirements": "- Kiến thức và kỹ năng: Có kiến thức và kỹ năng thực hành trong lĩnh vực công việc; có thể yêu cầu đào tạo nghề hoặc chứng chỉ (thông thường hoàn thành chương trình đào tạo nghề ngắn hạn hoặc chương trình đào tạo vận hành thiết bị / phương tiện) \n\n- Kinh nghiệm: Kinh nghiệm thực tế trong việc thực hiện các công việc tương tự; thời gian kinh nghiệm tùy thuộc vào yêu cầu và tính chất công việc.", "mercerRef": "Experienced Para-Professional (S2)"}, {"track": "Employee", "pcRange": "41", "grade": 2, "titleGroup": "Nhân viên thực hiện nghiệp vụ cơ bản", "examples": "Nhân viên vận hành thiết bị / phương tiện với thao tác đơn giản", "scope": "- Thực hiện các nhiệm vụ công việc hoặc vận hành đơn giản theo quy trình, hướng dẫn và tiêu chuẩn đã được thiết lập; trực tiếp tạo ra kết quả công việc thông qua việc thực hiện đúng thao tác, bảo đảm chất lượng, tiến độ và yêu cầu an toàn;\n- Có khả năng tự thực hiện các công việc quen thuộc sau khi được đào tạo hoặc hướng dẫn; cần hỗ trợ khi thực hiện nhiệm vụ mới hoặc gặp tình huống chưa quen thuộc;\n- Nhận biết các sai lệch và vấn đề đơn giản trong quá trình thực hiện; xử lý theo hướng dẫn hiện có hoặc báo cáo cấp trên khi vấn đề vượt quá phạm vi hướng dẫn, không tự ý xử lý các tình huống ngoài thẩm quyền;\n- Chịu trách nhiệm về việc thực hiện đúng quy trình, độ chính xác của thao tác và hoàn thành nhiệm vụ được giao; kết quả công việc được đánh giá chủ yếu qua mức độ tuân thủ, chất lượng thao tác và số lượng/tiến độ công việc hoàn thành;\n- Làm việc dưới sự giám sát thường xuyên; tiếp nhận, trao đổi và truyền đạt các thông tin cơ bản liên quan trực tiếp đến công việc.", "requirements": "- Kiến thức và kỹ năng: Có kiến thức cơ bản và được đào tạo về quy trình, phương pháp thực hiện công việc; trình độ học vấn hoặc chứng chỉ phù hợp với yêu cầu cụ thể của vị trí (thông thường tốt nghiệp trung học phổ thông)\n\n- Kinh nghiệm: Không nhất thiết yêu cầu kinh nghiệm trước đó", "mercerRef": "Entry Para-Professional (S1)"}, {"track": "Employee", "pcRange": "40", "grade": 1, "titleGroup": "Nhân viên thực hiện công việc đơn giản", "examples": "Nhân viên đóng gói, phục vụ, vệ sinh công nghiệp…", "scope": "- Thực hiện các nhiệm vụ đơn giản, có tính chất lặp lại theo các bước và hướng dẫn cụ thể đã được xác định; đóng góp trực tiếp vào hoạt động thông qua việc hoàn thành đúng thao tác và đáp ứng yêu cầu cơ bản về chất lượng, tiến độ và an toàn;\n- Công việc chủ yếu yêu cầu thao tác cơ bản, tuân thủ quy trình và thực hiện theo chỉ dẫn; không yêu cầu tổ chức nhiều bước công việc hoặc giải quyết vấn đề độc lập;\n- Nhận biết các sai lệch đơn giản trong quá trình thực hiện và báo cáo cấp trên để được hướng dẫn xử lý; không tự ý thay đổi phương pháp hoặc xử lý tình huống ngoài hướng dẫn;\n- Chịu trách nhiệm thực hiện đúng hướng dẫn, tuân thủ yêu cầu về an toàn và hoàn thành các nhiệm vụ được giao; kết quả được đánh giá thường xuyên thông qua mức độ hoàn thành và tuân thủ quy trình;\n- Làm việc dưới sự hướng dẫn và giám sát trực tiếp, thường xuyên; tiếp nhận và trao đổi các thông tin đơn giản, trực tiếp liên quan đến công việc.", "requirements": "- Kiến thức và kỹ năng: Có khả năng tiếp nhận hướng dẫn và thực hiện các thao tác cơ bản; trình độ học vấn phù hợp với tính chất và yêu cầu cụ thể của công việc\n\n- Kinh nghiệm: Không yêu cầu kinh nghiệm", "mercerRef": "Entry Para-Professional (S1)"}, {"track": "Professional", "pcRange": "57–58", "grade": 11, "titleGroup": "Cố vấn cao cấp tập đoàn", "examples": "Cố vấn hàng đầu trong lĩnh vực chuyên môn trọng yếu; tư vấn cho các lãnh đạo cấp cao nhất của các tập đoàn về những vấn đề có ảnh hưởng lớn đến định hướng và kết quả dài hạn.", "scope": "• Đóng vai trò cố vấn chuyên môn hàng đầu cho các lãnh đạo cấp cao nhất của Tập đoàn, HO và các CENTER; đưa ra quan điểm, phản biện và khuyến nghị độc lập đối với các vấn đề chuyên môn trọng yếu.\n• Tư vấn các quyết định có tính hệ thống, độ phức tạp cao hoặc hệ quả dài hạn; giúp lãnh đạo đánh giá lựa chọn, giả định, rủi ro và tác động đối với Tập đoàn, HO hoặc CENTER.\n• Định hình tư duy, nguyên lý, chuẩn mực và định hướng phát triển chuyên môn dài hạn; bảo đảm các khuyến nghị được xây dựng trên tri thức sâu, bằng chứng và phán đoán chuyên môn xuất sắc.\n• Tạo ảnh hưởng thông qua uy tín và chất lượng tư vấn, không thông qua quyền quản lý nhân sự hoặc quyền điều hành thay cho lãnh đạo.\n• Phát triển và lan tỏa tri thức chuyên môn; cố vấn cho đội ngũ chuyên gia kế cận. Có ảnh hưởng ở cấp ngành/xã hội, nhưng trọng tâm là vai trò cố vấn hàng đầu cho lãnh đạo cấp cao nhất của tập đoàn.", "requirements": "Năng lực, kiến thức và kỹ năng: Tầm nhìn chuyên môn xuất sắc; hiểu biết sâu sắc về Tập đoàn, lĩnh vực và xu hướng liên quan; tư duy hệ thống, dự báo, phản biện cấp cao và khả năng đưa ra phán đoán độc lập trong các vấn đề đặc biệt trọng yếu.\n\nHọc vấn/chứng chỉ: Thông thường tốt nghiệp Đại học trở lên; bằng Thạc sĩ/tiến sĩ hoặc chứng chỉ chuyên sâu là lợi thế tùy lĩnh vực. Thành tựu và uy tín chuyên môn thực tế là minh chứng quan trọng.\n\nKinh nghiệm: Thường trên 15 năm kinh nghiệm chuyên sâu; có thành tích tư vấn và định hướng chuyên môn được kiểm chứng. Sự công nhận ngoài Tập đoàn hoặc ảnh hưởng ở cấp ngành là lợi thế/minh chứng bổ sung.", "mercerRef": "Expert (P5)"}, {"track": "Professional", "pcRange": "55–56", "grade": 10, "titleGroup": "Cố vấn tập đoàn", "examples": "Cố vấn ở các tập đoàn trong một lĩnh vực chuyên môn trọng yếu (chiến lược, công nghệ, tài chính, nhân sự, pháp lý, phát triển bền vững hoặc lĩnh vực khác); tư vấn và đề xuất giải pháp có ảnh hưởng trên phạm vi toàn Tập đoàn.", "scope": "• Cung cấp tư vấn chuyên môn độc lập cho lãnh đạo Tập đoàn trong một lĩnh vực trọng yếu; phân tích các vấn đề phức tạp, có ảnh hưởng đến HO / nhiều Center và kết quả chung của Tập đoàn.\n• Nghiên cứu, đánh giá xu hướng, dữ liệu, phương án và thông lệ phù hợp; nhận diện giả định, rủi ro, cơ hội và hệ quả của các lựa chọn chiến lược/chuyên môn.\n• Đề xuất định hướng, chính sách, tiêu chuẩn, mô hình, lộ trình hoặc giải pháp chuyên môn có thể áp dụng trên phạm vi toàn Tập đoàn; làm rõ cơ sở, lợi ích, chi phí và điều kiện triển khai.\n• Tham vấn, phản biện và hỗ trợ lãnh đạo trong các quyết định thuộc lĩnh vực chuyên môn; ảnh hưởng thông qua chất lượng phân tích, khuyến nghị và uy tín chuyên môn, không thông qua quyền điều hành trực tiếp.\n• Theo dõi, đánh giá hiệu quả áp dụng các khuyến nghị/giải pháp; kiến nghị điều chỉnh khi kết quả hoặc bối cảnh thay đổi; chia sẻ tri thức và nâng cao năng lực chuyên môn trong Tập đoàn.\n• Trọng tâm là đóng góp chiến lược trung hạn (thường 1–3 năm) và ảnh hưởng toàn Tập đoàn trong lĩnh vực phụ trách. Là cố vấn chuyên môn hàng đầu trực tiếp cho lãnh đạo cấp cao nhất đối với các quyết định đặc biệt trọng yếu, có hệ quả dài hạn.", "requirements": "Năng lực, kiến thức và kỹ năng: Kiến thức chuyên môn sâu rộng trong lĩnh vực phụ trách; tư duy hệ thống và chiến lược; năng lực nghiên cứu, phân tích, phản biện độc lập, đánh giá phương án/rủi ro và trình bày khuyến nghị cho lãnh đạo cấp cao.\n\nHọc vấn/chứng chỉ: Thông thường tốt nghiệp Đại học trở lên; bằng sau Đại học hoặc chứng chỉ chuyên môn cao cấp là lợi thế tùy lĩnh vực.\n\nKinh nghiệm: Thường 12–15 năm kinh nghiệm chuyên sâu; có thành tích tư vấn, xây dựng chính sách/tiêu chuẩn hoặc giải pháp tạo ảnh hưởng ở cấp Tập đoàn.", "mercerRef": "Expert (P5)"}, {"track": "Professional", "pcRange": "53–54", "grade": 9, "titleGroup": "Chuyên gia cao cấp (HO / CENTER)", "examples": "Chuyên gia cấp BU trong các lĩnh vực chiến lược, nhân sự, tài chính, pháp lý, kỹ thuật, công nghệ, vận hành hoặc lĩnh vực chuyên môn trọng yếu khác.", "scope": "• Đảm nhiệm vai trò chuyên gia ở HO hoặc một CENTER; phạm vi trách nhiệm chuyên môn được xác lập ở cấp toàn HO hoặc toàn CENTER, không chỉ giới hạn trong một Khối.\n• Chịu trách nhiệm chuyên môn thường xuyên đối với các vấn đề, giải pháp, phương pháp, tiêu chuẩn hoặc chương trình có ảnh hưởng đến nhiều Khối/bộ phận trong HO hoặc CENTER, theo phạm vi chức năng được giao.\n• Tích hợp kiến thức và phối hợp liên Khối/bộ phận để giải quyết vấn đề có nhiều yếu tố phụ thuộc; tư vấn, phản biện và hướng dẫn chuyên môn cho lãnh đạo/chuyên gia trong phạm vi HO hoặc CENTER.\n• Chịu trách nhiệm về chất lượng, tính khả thi, khả năng triển khai và hiệu quả chuyên môn của giải pháp; kết quả cần thể hiện qua tiêu chuẩn/phương pháp được áp dụng hoặc cải thiện hiệu quả, chất lượng, chi phí và kiểm soát rủi ro ở cấp HO hoặc CENTER.\n• Ảnh hưởng được tạo ra thông qua chuyên môn, không thông qua quyền quản lý nhân sự trực tiếp.", "requirements": "Năng lực, kiến thức và kỹ năng: Chuyên môn rất sâu; hiểu biết đa dạng về mô hình hoạt động của HO và các CENTER; có năng lực tích hợp nhiều lĩnh vực, thiết kế tiêu chuẩn, dẫn dắt chuyên môn dự án liên HO-CENTER và đánh giá tác động.\n\nHọc vấn/chứng chỉ: Thông thường Đại học trở lên; bằng sau Đại học/chứng chỉ chuyên gia là lợi thế hoặc yêu cầu theo lĩnh vực.\n\nKinh nghiệm: Thường 10–12 năm kinh nghiệm chuyên sâu; có minh chứng về giải pháp/tiêu chuẩn/dự án có ảnh hưởng ở HO và nhiều CENTER.", "mercerRef": "Specialist Professional (P4)"}, {"track": "Professional", "pcRange": "51–52", "grade": 8, "titleGroup": "Chuyên gia (HO / Center)", "examples": "Chuyên gia nhân sự, tài chính, kỹ thuật, công nghệ, vận hành hoặc lĩnh vực chuyên môn khác; chịu trách nhiệm chuyên môn trọng yếu ở cấp một Khối ở một công ty", "scope": "• Đảm nhiệm vai trò chuyên gia ở cấp một Khối thuộc HO hoặc một CENTER; chịu trách nhiệm chuyên môn trọng yếu trong phạm vi Khối được giao.\n• Giải quyết các vấn đề chuyên môn có độ khó/độ phức tạp cao gắn với mục tiêu và ưu tiên của Khối; thực hiện độc lập và chịu trách nhiệm về chất lượng, tính khả thi và hiệu quả của giải pháp, phân tích hoặc dự án.\n• Phát triển, cải tiến hoặc triển khai mô hình, công cụ, quy trình, tiêu chuẩn hoặc dự án chuyên môn nhằm cải thiện hiệu quả, chất lượng, chi phí, dịch vụ, quản trị rủi ro hoặc năng lực vận hành của Khối.\n• Có thể tư vấn, chia sẻ tri thức hoặc hỗ trợ các Khối/bộ phận khác khi cần; tuy nhiên, phạm vi trách nhiệm chuyên môn chính và kết quả trọng yếu được xác định ở cấp một Khối.\n• Ảnh hưởng được tạo ra thông qua chuyên môn, không thông qua quyền quản lý nhân viên trực tiếp.", "requirements": "Năng lực, kiến thức và kỹ năng: Kiến thức chuyên sâu trong một phân ngành; hiểu mô hình, quy mô và đặc thù của HO/ CENTER; có năng lực giải quyết vấn đề phức tạp, phát triển giải pháp và đánh giá hiệu quả ứng dụng.\n\nHọc vấn/chứng chỉ: Thông thường Đại học trở lên; đào tạo/chứng chỉ chuyên sâu phù hợp lĩnh vực là lợi thế hoặc yêu cầu của vị trí.\n\nKinh nghiệm: Thường 8–10 năm kinh nghiệm chuyên sâu; có thành tích thực tế ở phạm vi HO / CENTER.", "mercerRef": "Specialist Professional (P4)"}, {"track": "Professional", "pcRange": "49–50", "grade": 7, "titleGroup": "Chuyên viên cao cấp", "examples": "Chuyên viên cao cấp về nhân sự, tài chính, pháp chế, quản trị rủi ro..., kỹ sư cao cấp về kỹ thuật, công nghệ ...hoặc lĩnh vực chuyên môn khác", "scope": "• Đóng góp từ một phần đến trực tiếp vào kết quả chung của Khối trong chu kỳ hoạt động một năm; mức độ đóng góp thể hiện qua đầu ra chuyên môn, khả năng giải quyết vấn đề phức tạp và cải thiện hiệu quả của các quy trình/hệ thống trong phạm vi Khối.\n• Xử lý độc lập các công việc chuyên môn phức tạp, chủ động giải quyết vấn đề trong phạm vi phụ trách với sự giám sát hạn chế; chịu trách nhiệm về chất lượng phân tích, tính khả thi của giải pháp và kết quả chuyên môn được giao.\n• Có kiến thức sâu về quy trình/hệ thống; đề xuất xây dựng, sửa đổi hoặc cải tiến quy trình, phương pháp và công cụ chuyên môn trong phạm vi Khối, qua đó nâng cao chất lượng, năng suất hoặc kiểm soát rủi ro của Khối.\n• Có thể hướng dẫn, kèm cặp hoặc rà soát chất lượng chuyên môn của đồng nghiệp thông qua chia sẻ tri thức; không quản lý nhân viên trực tiếp.", "requirements": "Năng lực, kiến thức và kỹ năng: Kiến thức chuyên môn sâu; phân tích vấn đề đa chiều, xác định nguyên nhân gốc rễ, đánh giá tác động/rủi ro và thiết kế cải tiến quy trình.\n\nHọc vấn/chứng chỉ: Thông thường tốt nghiệp Đại học; chứng chỉ chuyên môn theo yêu cầu vị trí.\n\nKinh nghiệm: Thường 5–8 năm kinh nghiệm chuyên sâu; có kinh nghiệm xử lý độc lập vấn đề phức tạp và cải tiến quy trình/hệ thống.", "mercerRef": "Senior Professional (P3)"}, {"track": "Professional", "pcRange": "47–48", "grade": 6, "titleGroup": "Chuyên viên chính", "examples": "Chuyên viên chính về nhân sự, tài chính, kế toán, pháp chế..., /kỹ sư chính về kỹ thuật, công nghệ ...hoặc lĩnh vực chuyên môn khác", "scope": "• Đóng góp một phần vào kết quả chung của Phòng/Ban trong chu kỳ một năm thông qua việc hoàn thành các đầu ra chuyên môn có chất lượng, đúng hạn và xử lý được các công việc có độ khó cao; đóng góp không chỉ ở sản phẩm cá nhân mà còn ở hiệu quả của một phần hoạt động trong Phòng/Ban.\n• Thực hiện công việc với mức giám sát tương đối ít; vận dụng kiến thức sâu và rộng về quy trình/hệ thống để xử lý tình huống không hoàn toàn theo thông lệ, bảo đảm tính chính xác, đầy đủ và hiệu quả của kết quả chuyên môn.\n• Đề xuất sửa đổi, cải tiến quy trình hoặc phương pháp trong lĩnh vực phụ trách; nhận diện rủi ro và đề xuất phương án xử lý, qua đó góp phần giảm lỗi, thời gian xử lý hoặc rủi ro và cải thiện chất lượng công việc của Phòng/Ban.\n• Có thể hướng dẫn chuyên môn cho đồng nghiệp ở cấp thấp hơn thông qua trao đổi và chia sẻ tri thức; không có trách nhiệm quản lý nhân viên trực tiếp.", "requirements": "Năng lực, kiến thức và kỹ năng: Kiến thức chuyên môn vững; hiểu rõ quy trình, chính sách và hệ thống liên quan; có khả năng phân tích, xử lý nghiệp vụ phức tạp và đề xuất cải tiến.\n\nHọc vấn/chứng chỉ: Thông thường tốt nghiệp Đại học; chứng chỉ chuyên môn theo yêu cầu vị trí.\n\nKinh nghiệm: Thường 3–5 năm kinh nghiệm chuyên sâu trong công việc liên quan.", "mercerRef": "Experienced Professional (P2)"}, {"track": "Professional", "pcRange": "45–46", "grade": 5, "titleGroup": "Chuyên viên", "examples": "Chuyên viên về nhân sự, tài chính, kế toán, kinh doanh..., /kỹ sư về kỹ thuật, công nghệ ...hoặc lĩnh vực chuyên môn khác", "scope": "• Trực tiếp hoàn thành đầu ra công việc cá nhân theo nhiệm vụ được giao; đóng góp một phần vào kết quả chung của Phòng/Ban thông qua chất lượng, độ chính xác, tính tuân thủ và tiến độ của sản phẩm công việc.\n• Thực hiện công việc chuyên môn có độ khó nhất định, vận dụng kiến thức nền tảng và quy trình/hệ thống đã thiết lập; làm việc với sự giám sát định kỳ và bảo đảm sản phẩm/báo cáo/phân tích/nghiệp vụ cá nhân đáp ứng yêu cầu, thời hạn và hạn chế sai sót.\n• Phân tích thông tin, nhận diện vấn đề nghiệp vụ thường gặp và đề xuất hướng xử lý; có thể góp ý cải thiện cách thức thực hiện công việc cá nhân hoặc bộ phận, nhưng đóng góp chủ yếu vẫn thông qua chất lượng đầu ra của phần việc được giao.\n• Chịu trách nhiệm về chất lượng, tính tuân thủ và tiến độ của đầu ra cá nhân; phối hợp với các bên liên quan để hoàn thành nhiệm vụ.", "requirements": "Năng lực, kiến thức và kỹ năng: Kiến thức nền tảng và chuyên môn phù hợp; nắm quy trình, chính sách và phương pháp nghiệp vụ; có kỹ năng phân tích thông tin, xử lý dữ liệu, lập báo cáo và phối hợp.\n\nHọc vấn/chứng chỉ: Thông thường tốt nghiệp Đại học hoặc Cao đẳng phù hợp; chứng chỉ chuyên môn tùy yêu cầu vị trí.\n\nKinh nghiệm: Thường 1–2 năm với trình độ Đại học hoặc 2–3 năm với trình độ Cao đẳng,", "mercerRef": "Entry Professional (P1)"}, {"track": "Management & Leadership", "pcRange": "68 ꟷ 70", "grade": 15, "titleGroup": "Hội đồng Quản trị (HO / CENTER)", "examples": "Chủ tịch HĐQT; Thành viên HĐQT; thành viên các Ủy ban trực thuộc HĐQT (tùy mô hình quản trị).", "scope": "• QUẢN TRỊ VÀ GIÁM SÁT DÀI HẠN CẤP DOANH NGHIỆP: Là cấp lãnh đạo cao nhất; thực hiện vai trò quản trị, định hướng và giám sát để bảo vệ giá trị dài hạn và tính bền vững của doanh nghiệp.\n• Định hình/giám sát tầm nhìn 10–15 năm và chiến lược 3–5 năm; bảo đảm sự phù hợp giữa định hướng chiến lược, nguồn lực, năng lực thực thi và lợi ích dài hạn của doanh nghiệp.\n• Thông qua định hướng chiến lược, mục tiêu dài hạn, khẩu vị rủi ro, chính sách quản trị trọng yếu và các quyết định thuộc thẩm quyền HĐQT.\n• Giám sát Tổng Giám đốc và Ban Điều hành; đánh giá hiệu quả quản trị, kết quả kinh doanh, hệ thống kiểm soát nội bộ, quản trị rủi ro, tuân thủ và tính bền vững.\n• Quyết định hoặc giám sát các vấn đề trọng yếu như cơ cấu quản trị, bổ nhiệm/miễn nhiệm chức danh thuộc thẩm quyền, đầu tư lớn, giao dịch trọng yếu và kế hoạch kế nhiệm theo quy định.\n•  Trọng tâm của vai trò là quản trị, định hướng, giám sát và trách nhiệm giải trình; không thay thế vai trò điều hành thường nhật của Tổng Giám đốc và Ban Điều hành.", "requirements": "Năng lực, kiến thức và kỹ năng: Tầm nhìn chiến lược và tư duy quản trị doanh nghiệp; hiểu biết sâu về ngành, tài chính, đầu tư, quản trị rủi ro, pháp lý và trách nhiệm quản trị; năng lực đánh giá độc lập, chất vấn, ra quyết định tập thể và bảo vệ lợi ích dài hạn.\n\nHọc vấn/chứng chỉ: Theo quy định pháp luật, điều lệ và tiêu chuẩn quản trị áp dụng; chứng chỉ quản trị công ty hoặc chuyên môn liên quan là lợi thế.\n\nKinh nghiệm: Thường có kinh nghiệm lãnh đạo cấp cao, quản trị doanh nghiệp hoặc chuyên môn sâu phù hợp; có uy tín và khả năng thực hiện trách nhiệm giám sát độc lập.", "mercerRef": "Executive Tier 2 (ET2)"}, {"track": "Management & Leadership", "pcRange": "65 ꟷ 67", "grade": 14, "titleGroup": "Tổng Giám đốc (HO / CENTER)", "examples": "Tổng Giám đốc Tập đoàn; Tổng Giám đốc các công ty có quy mô, mức độ phức tạp và quyền tự chủ lớn.", "scope": "• KẾT QUẢ TỔNG THỂ DOANH NGHIỆP: Chịu trách nhiệm cuối cùng về kết quả tổng thể của HO/CENTER trong phạm vi được giao; chuyển hóa định hướng của HĐQT/chủ sở hữu thành chiến lược 3–5 năm, kế hoạch 1–3 năm và kết quả kinh doanh, vận hành, tài chính, khách hàng, con người và phát triển bền vững.\n• Chịu trách nhiệm cao nhất về điều hành và kết quả hoạt động tổng thể của HO/CENTER trong phạm vi được giao; chuyển hóa chiến lược và nghị quyết của HĐQT/chủ sở hữu thành mục tiêu, kế hoạch và kết quả thực thi.\n• Định hình chiến lược kinh doanh, mô hình hoạt động, danh mục ưu tiên và phân bổ nguồn lực; chịu trách nhiệm về kết quả tài chính, tăng trưởng, khách hàng/thị trường, hiệu quả vận hành và phát triển bền vững.\n• Thiết lập cơ cấu tổ chức, đội ngũ lãnh đạo, văn hóa và hệ thống quản trị; phát triển năng lực tổ chức, quản trị nhân tài và kế nhiệm cho các vị trí trọng yếu.\n• Ra quyết định đối với các vấn đề kinh doanh, đầu tư, vận hành và rủi ro có tác động rộng; cân bằng lợi ích ngắn hạn và dài hạn, xử lý các tình huống khủng hoảng hoặc thay đổi lớn.\n• Chịu trách nhiệm giải trình trước HĐQT/chủ sở hữu về hiệu quả điều hành, tính tuân thủ, quản trị rủi ro và việc thực hiện các mục tiêu đã cam kết.", "requirements": "Năng lực, kiến thức và kỹ năng: Năng lực điều hành doanh nghiệp toàn diện; tư duy chiến lược và thương mại; năng lực quản trị P&L, đầu tư, chuyển đổi, rủi ro, văn hóa và đội ngũ lãnh đạo; khả năng ra quyết định trong điều kiện bất định và đại diện doanh nghiệp với các bên liên quan.\n\nHọc vấn/chứng chỉ: Thường có trình độ Đại học trở lên; đào tạo quản trị/điều hành cấp cao là lợi thế.\n\nKinh nghiệm: Thường có nhiều năm kinh nghiệm lãnh đạo cấp cao và thành tích điều hành doanh nghiệp ở quy mô lớn, đa chức năng hoặc đa đơn vị.", "mercerRef": "Executive Tier 2 (ET2)"}, {"track": "Management & Leadership", "pcRange": "62 ꟷ 64", "grade": 13, "titleGroup": "Phó tổng Giám đốc (HO / CENTER)", "examples": "Phó Tổng Giám đốc phụ trách một hoặc nhiều Khối chức năng/lĩnh vực cáp tập đoàn hay công ty có quy mô lớn", "scope": "• Đóng góp trực tiếp và quan trọng vào kết quả trung và dài hạn của HO/ CENTER thông qua một danh mục chức năng, lĩnh vực kinh doanh hoặc các đơn vị được ủy quyền; chịu trách nhiệm về chiến lược, kế hoạch và kết quả tích hợp trong phạm vi phụ trách.\n• Chịu trách nhiệm điều hành một danh mục chức năng, lĩnh vực kinh doanh hoặc chương trình chiến lược quan trọng; chuyển hóa chiến lược chung thành mục tiêu, kế hoạch và kết quả trong phạm vi được phân công.\n• Tích hợp hoạt động của nhiều khối/phòng ban hoặc đơn vị; giải quyết các ưu tiên xung đột, phụ thuộc liên chức năng và vấn đề có ảnh hưởng đáng kể đến kết quả toàn HO/ CENTER.\n• Đề xuất chiến lược chức năng/kinh doanh, chính sách phân bổ nguồn lực, đầu tư và sáng kiến chuyển đổi; chịu trách nhiệm về hiệu quả thực thi và các chỉ tiêu được ủy quyền.\n• Phát triển đội ngũ lãnh đạo cấp dưới, năng lực tổ chức và cơ chế phối hợp; xây dựng văn hóa trách nhiệm, hiệu suất và tuân thủ.\n• Thay mặt Tổng Giám đốc xử lý các vấn đề hoặc điều hành hoạt động theo phạm vi ủy quyền; chịu trách nhiệm giải trình về quyết định và kết quả trong lĩnh vực phụ trách.", "requirements": "Năng lực, kiến thức và kỹ năng: Năng lực lãnh đạo đa chức năng hoặc lĩnh vực kinh doanh; tư duy chiến lược, quản trị hiệu quả và nguồn lực; khả năng tích hợp hoạt động, quản trị thay đổi, xử lý vấn đề phức tạp và phát triển đội ngũ lãnh đạo.\n\nHọc vấn/chứng chỉ: Thường có trình độ Đại học trở lên; bằng sau Đại học hoặc chương trình lãnh đạo cấp cao là lợi thế.\n\nKinh nghiệm: Thường có kinh nghiệm lãnh đạo nhiều đơn vị/chức năng  được kiểm chứng hoặc lĩnh vực kinh doanh trọng yếu; có thành tích quản trị kết quả ở doanh nghiệp có quy mô lớn.", "mercerRef": "Executive Tier 3 (ET3)"}, {"track": "Management & Leadership", "pcRange": "59 ꟷ 61", "grade": 12, "titleGroup": "Lãnh đạo cao cấp khối chức năng (HO / CENTER)", "examples": "Giám đốc chức năng cao cấp tại các doanh nghiệp; lãnh đạo Khối chức năng có quy mô lớn, nhiều mảng chuyên môn hoặc mức độ rủi ro/tác động cao.", "scope": "• Đóng góp quan trọng vào kết quả ngắn và trung hạn của HO/CENTER thông qua định hướng, kế hoạch 1–3 năm, chính sách và chuyển đổi của một khối/chức năng lớn; tác động đến nhiều phòng ban hoặc đơn vị trong phạm vi chức năng.\n• Định hình định hướng và chịu trách nhiệm về hiệu quả tổng thể của một chức năng/khối chức năng trọng yếu tại HO hoặc CENTER; bảo đảm chiến lược chức năng phù hợp với định hướng kinh doanh và ưu tiên của đơn vị.\n• Xây dựng kế hoạch trung và dài hạn, chính sách, mô hình vận hành, ngân sách và lộ trình năng lực cho chức năng; dẫn dắt các chương trình cải tổ hoặc chuyển đổi có phạm vi rộng.\n• Điều phối nhiều phòng ban/chuyên môn trong chức năng; giải quyết vấn đề liên chức năng, rủi ro đáng kể và các quyết định có ảnh hưởng đến nhiều đơn vị.\n• Chịu trách nhiệm về kết quả chức năng như hiệu quả, chất lượng dịch vụ, chi phí, năng suất, kiểm soát rủi ro và mức độ đáp ứng khách hàng nội bộ/bên ngoài.\n• Xây dựng đội ngũ quản lý kế cận, chuẩn hóa phương pháp quản trị và thúc đẩy hợp tác với các chức năng/đơn vị khác.", "requirements": "Năng lực, kiến thức và kỹ năng: Kiến thức sâu rộng về chức năng và hoạt động kinh doanh; hoạch định chiến lược chức năng, quản trị ngân sách/KPI, quản trị rủi ro, chuyển đổi và điều phối nhiều nhóm quản lý.\n\nHọc vấn/chứng chỉ: Thường có trình độ Đại học trở lên; chứng chỉ chuyên môn/lãnh đạo phù hợp với chức năng là lợi thế.\n\nKinh nghiệm: Thường có 3-5 năm kinh nghiệm lãnh đạo chức năng lớn hoặc nhiều mảng chuyên môn; có thành tích cải thiện kết quả và năng lực của chức năng.", "mercerRef": "Senior Director (M6)"}, {"track": "Management & Leadership", "pcRange": "57 ꟷ 58", "grade": 11, "titleGroup": "Lãnh đạo Khối chức năng (HO / CENTER)\nLãnh đạo đơn vị kinh doanh  (Tier 1)", "examples": "Giám đốc Khối chức năng một công ty lớn; Lãnh đạo BU có phạm vi, quy mô hoặc độ phức tạp lớn.", "scope": "• Đóng góp trực tiếp và quan trọng vào kết quả ngắn và trung hạn của HO/CENTER thông qua kết quả của một Khối chức năng hoặc một đơn vị hoạt động lớn; chuyển hóa chiến lược thành kế hoạch, chính sách và kết quả của phạm vi phụ trách.\n• Chịu trách nhiệm về kết quả của một Khối chức năng hoặc đơn vị hoạt động của một CENTER; chuyển hóa mục tiêu HO/CENTER thành kế hoạch hoạt động, ngân sách và chỉ tiêu cụ thể.\n• Xây dựng kế hoạch chức năng, chính sách và mô hình vận hành trong phạm vi phụ trách; đề xuất ưu tiên đầu tư, nguồn lực và cải tiến để đạt mục tiêu.\n• Lãnh đạo nhiều Phòng/Ban hoặc các bộ phận chuyên môn; bảo đảm phối hợp, phân định trách nhiệm và giải quyết các vấn đề ảnh hưởng đến kết quả chung.\n• Chịu trách nhiệm về các chỉ tiêu tài chính / phi tài chính như chi phí, năng suất, chất lượng, dịch vụ, an toàn và tuân thủ tùy lĩnh vực.\n• Phát triển năng lực quản lý cấp trung, quản trị hiệu suất và kế nhiệm; xây dựng môi trường làm việc có trách nhiệm và hướng đến kết quả.", "requirements": "Năng lực, kiến thức và kỹ năng: Lãnh đạo nhiều Phòng/Ban hoặc một Khối chức năng lớn; lập kế hoạch và quản trị ngân sách; quản trị hiệu suất, vận hành, nhân sự và rủi ro; năng lực điều phối và dẫn dắt thay đổi.\n\nHọc vấn/chứng chỉ: Thường có trình độ Đại học trở lên; chứng chỉ chuyên môn/lãnh đạo phù hợp với chức năng là lợi thế.\n\nKinh nghiệm: Thường có 8-10 năm kinh nghiệm lãnh đạo chức năng có nhiều mảng chuyên môn// đơn vị kinh doanh quy mô lớn; có thành tích cải thiện kết quả hoạt động/kinh doanh và năng lực của chức năng/đơn vị.", "mercerRef": "Director (M5)"}, {"track": "Management & Leadership", "pcRange": "55 ꟷ 56", "grade": 10, "titleGroup": "Quản lý phòng cao cấp (HO / CENTER)\nLãnh đạo đơn vị kinh doanh (Tier 2)", "examples": "Trưởng phòng/ban cao cấp tại một công ty lớn; lãnh đạo BU có quy mô hoạt động và mức độ phức tạp trung bình-lớn.", "scope": "• Đóng góp trực tiếp vào kết quả hoạt động hằng năm của HO/CENTER thông qua việc điều hành một Phòng/Ban hay một dơn vị hoạt động có quy mô và độ phức tạp trung bình-lớn; chịu trách nhiệm kế hoạch trung hạn 1–3 năm, kế hoạch năm, ngân sách và các chỉ tiêu được giao.\n• Chịu trách nhiệm về kết quả hoạt động của một Phòng/Ban hay đơn vị hoạt động có quy mô và độ phức tạp trung bình-lớn; cụ thể hóa mục tiêu cấp trên thành kế hoạch, ngân sách, KPI và phân bổ nguồn lực.\n• Quản lý một lĩnh vực chuyên môn/hoạt động kinh doanh có nhiều quy trình, nhóm công việc hoặc chuyên ngành; bảo đảm chất lượng, tiến độ, năng suất và tính liên tục của hoạt động.\n• Đưa ra quyết định trong phạm vi chính sách và ngân sách được giao; xử lý vấn đề phức tạp, phối hợp với các Phòng/Ban liên quan và đề xuất thay đổi khi cần.\n• Quản lý, phát triển nhân sự và đội ngũ quản lý/giám sát cấp dưới; thiết lập mục tiêu, phản hồi hiệu suất, huấn luyện và xây dựng năng lực kế cận.\n• Theo dõi ngân sách, rủi ro, tuân thủ và chất lượng dịch vụ/sản phẩm; chịu trách nhiệm về kết quả tài chính / phi tài chính của Phòng/Ban hay đơn vị trước cấp quản lý cao hơn.", "requirements": "Năng lực, kiến thức và kỹ năng: Quản lý phòng hoặc đơn vị kinh doanh; lập kế hoạch, ngân sách và KPI; quản trị quy trình, chất lượng, nhân sự, quan hệ liên phòng ban và giải quyết vấn đề.\n\nHọc vấn/chứng chỉ: Thường có trình độ Đại học hoặc chuyên môn tương đương; chứng chỉ quản lý/chuyên môn tùy lĩnh vực.\n\nKinh nghiệm: Thường có 5-8 năm kinh nghiệm chuyên môn sâu và quản lý nhóm/đội ngũ; có minh chứng đạt mục tiêu phòng hoặc đơn vị.", "mercerRef": "Senior Manager (M4)"}, {"track": "Management & Leadership", "pcRange": "53 ꟷ 54", " const V5_KEY='ja_platform_v5_workspace';
let activeWorkspace='Default Workspace';
let auditLog=[];
function loadWorkspace(){try{const raw=localStorage.getItem(V5_KEY);if(!raw)return;const state=JSON.parse(raw);activeWorkspace=state.activeWorkspace||activeWorkspace;const w=(state.workspaces||{})[activeWorkspace];if(w&&Array.isArray(w.positions)){positions=w.positions.map(r=>({...r,track:trackFor(r),grade:gradeFor(Number(r.pc),trackFor(r)),family:familyFor(r.title||'')}));auditLog=state.auditLog||[]}}catch(e){console.warn('Workspace restore skipped',e)}}
function saveWorkspace(action,detail){try{const state=JSON.parse(localStorage.getItem(V5_KEY)||'{"workspaces":{},"auditLog":[]}');state.workspaces=state.workspaces||{};state.activeWorkspace=activeWorkspace;state.workspaces[activeWorkspace]={positions:positions.map(({track,grade,family,...r})=>r),updatedAt:new Date().toISOString()};state.auditLog=state.auditLog||[];state.auditLog.unshift({at:new Date().toISOString(),workspace:activeWorkspace,action,detail});state.auditLog=state.auditLog.slice(0,200);auditLog=state.auditLog;localStorage.setItem(V5_KEY,JSON.stringify(state));return true}catch(e){alert('Không thể lưu workspace. Trình duyệt có thể đã hết dung lượng.');return false}}

function exportBackup(){const payload={schemaVersion:'5.0',sourceBaseline:'Enterprise Job Architecture Platform V4.0',workspace:activeWorkspace,exportedAt:new Date().toISOString(),positions:positions.map(({track,grade,family,...r})=>r),pcMatrix:DB.pcMatrix,gradeDefs:DB.gradeDefs,auditLog};downloadBlob(JSON.stringify(payload,null,2),'job_architecture_backup.json','application/json')}
function downloadBlob(content,name,type){const a=document.createElement('a');const u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function parseCSV(text){let rows=[],row=[],v='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){v+='"';i++}else if(c==='"'){q=!q}else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(v);if(row.some(x=>x!==''))rows.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x!==''))rows.push(row);if(rows.length<2)throw Error('CSV không có dữ liệu.');const headers=rows.shift().map(x=>x.trim());return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])))}
function validateImport(rows){const errors=[];if(!rows.length)errors.push('Không có bản ghi.');const seen=new Set();rows.forEach((r,i)=>{const line=i+2;if(!String(r.Division??r.division??'').trim())errors.push(`Dòng ${line}: thiếu Division`);if(!String(r.Title??r.title??'').trim())errors.push(`Dòng ${line}: thiếu Title`);const pc=Number(r.PC??r.pc);if(!Number.isFinite(pc)||pc<0)errors.push(`Dòng ${line}: PC không hợp lệ`);const key=[r.Division??r.division,r.Title??r.title].join('|').toLowerCase();if(seen.has(key))errors.push(`Dòng ${line}: trùng Division + Title`);seen.add(key);});return errors}
async function importDataFile(input){const file=input.files?.[0];if(!file)return;try{let rows;if(file.name.toLowerCase().endsWith('.json')){const obj=JSON.parse(await file.text());rows=Array.isArray(obj)?obj:obj.positions;if(!Array.isArray(rows))throw Error('JSON phải chứa mảng positions.')}else if(file.name.toLowerCase().endsWith('.csv'))rows=parseCSV(await file.text());else throw Error('Phiên bản này hỗ trợ CSV và JSON. XLSX sẽ được bật ở bản kế tiếp sau khi tích hợp và kiểm thử thư viện đọc Excel.');const errors=validateImport(rows);if(errors.length){document.getElementById('importResult').innerHTML='<div class="notice">'+errors.slice(0,12).map(esc).join('<br>')+(errors.length>12?`<br>… và ${errors.length-12} lỗi khác`: '')+'</div>';return}const normalized=rows.map((r,i)=>({no:Number(r.No??r.no??i+1),division:String(r.Division??r.division).trim(),title:String(r.Title??r.title).trim(),type:String(r.Type??r.type??'PE').toUpperCase(),pc:Number(r.PC??r.pc),orgSize:numOrNull(r.OrgSize??r.orgSize),impact:numOrNull(r.Impact??r.impact),contribution:numOrNull(r.Contribution??r.contribution),communication:numOrNull(r.Communication??r.communication),frame:numOrNull(r.Frame??r.frame),innovation:numOrNull(r.Innovation??r.innovation),complexity:numOrNull(r.Complexity??r.complexity),knowledge:numOrNull(r.Knowledge??r.knowledge),team:numOrNull(r.Team??r.team),breadth:numOrNull(r.Breadth??r.breadth),comments:r.Comments??r.comments??null}));positions=normalized.map(r=>({...r,track:trackFor(r),grade:gradeFor(r.pc,trackFor(r)),family:familyFor(r.title)}));saveWorkspace('IMPORT',`${positions.length} position records from ${file.name}`);document.getElementById('importResult').innerHTML=`<div class="notice good">Đã nhập ${positions.length} bản ghi vào workspace ${esc(activeWorkspace)}. Dữ liệu gốc trong V4 vẫn được giữ nguyên trong gói nguồn.</div>`;render()}catch(e){document.getElementById('importResult').innerHTML='<div class="notice">'+esc(e.message)+'</div>'}finally{input.value=''}}
function numOrNull(v){if(v===undefined||v===null||v==='')return null;const n=Number(v);return Number.isFinite(n)?n:null}
function dataQuality(){const missing=positions.filter(p=>!p.division||!p.title||!Number.isFinite(Number(p.pc))).length;const duplicates=positions.length-new Set(positions.map(p=>(p.division+'|'+p.title).toLowerCase())).size;const invalidType=positions.filter(p=>!['PE','SLOT'].includes(String(p.type).toUpperCase())).length;const invalidPC=positions.filter(p=>!Number.isFinite(Number(p.pc))||Number(p.pc)<0).length;const ratingFields=['impact','contribution','communication','frame','innovation','complexity','knowledge','team','breadth'];const outOfRange=positions.filter(p=>ratingFields.some(k=>p[k]!==null&&p[k]!==undefined&&p[k]!==''&&(!Number.isFinite(Number(p[k]))||Number(p[k])<0))).length;return {missing,duplicates,invalidType,invalidPC,outOfRange}}
function governance(){const q=dataQuality(),issues=q.missing+q.duplicates+q.invalidType+q.invalidPC+q.outOfRange;return head('Data Governance & Import','Quản lý workspace, kiểm tra chất lượng dữ liệu, sao lưu và theo dõi thay đổi. Dữ liệu lưu tại trình duyệt hiện tại; chưa phải cloud database.')+`<div class="stats"><div class="stat"><b>${positions.length}</b><span>Position records</span></div><div class="stat"><b>${DB.pcMatrix.length}</b><span>PC Matrix records · source baseline</span></div><div class="stat"><b>${DB.gradeDefs.length}</b><span>Grade definitions · source baseline</span></div><div class="stat"><b>${issues}</b><span>Data quality flags</span></div></div><div class="card"><h2>Workspace</h2><div class="toolbar"><input id="workspaceName" value="${esc(activeWorkspace)}" aria-label="Workspace name"><button class="action" onclick="switchWorkspace()">Open / Create Workspace</button><button class="secondary" onclick="resetWorkspace()">Restore V4 baseline</button></div><p class="small muted">Workspace chỉ tách dữ liệu trong localStorage của trình duyệt này; không có tenant isolation phía server.</p></div><div class="grid2"><div class="card"><h2>Import & Export</h2><p>Import dữ liệu vị trí từ CSV hoặc JSON. Các trường bắt buộc: Division, Title, PC. Kiểm tra lỗi trước khi thay thế dữ liệu workspace đang mở.</p><div class="toolbar"><input type="file" id="dataFile" accept=".csv,.json" onchange="importDataFile(this)"></div><div id="importResult"></div><div class="toolbar"><button class="action" onclick="exportPositionsCSV()">Export Positions CSV</button><button class="secondary" onclick="exportBackup()">Download JSON Backup</button></div><p class="small muted">XLSX import/export và PowerPoint export chưa được bật trong bản này; không hiển thị như tính năng đã hoàn thành.</p></div><div class="card"><h2>Data Quality Checks</h2>${[['Missing required fields',q.missing],['Duplicate Division + Title',q.duplicates],['Invalid PE / SLOT type',q.invalidType],['Invalid PC value',q.invalidPC],['Negative / non-numeric factor values',q.outOfRange]].map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span>${k}</span><b>${v}</b></div>`).join('')}<p class="small muted">Kiểm tra cấu trúc và tính hợp lệ cơ bản; không đánh giá lại Mercer IPE/PE, PC hoặc factor ratings.</p></div></div><div class="card"><h2>Change history (browser-local)</h2>${auditLog.length?table(['Timestamp','Workspace','Action','Details'],auditLog.slice(0,30).map(x=>`<tr><td>${esc(x.at)}</td><td>${esc(x.workspace)}</td><td>${esc(x.action)}</td><td>${esc(x.detail)}</td></tr>`)):'<p class="empty">Chưa có thay đổi được ghi nhận trong workspace hiện tại.</p>'}</div><div class="notice info">Governance boundary: phiên bản này bổ sung workspace, kiểm tra dữ liệu, backup và nhật ký ở trình duyệt. Đăng nhập, phân quyền, phê duyệt nhiều cấp, audit log phía server, đồng bộ nhiều người dùng và tenant isolation vẫn cần backend riêng.</div>`}
function switchWorkspace(){const n=document.getElementById('workspaceName').value.trim();if(!n){alert('Nhập tên workspace.');return}saveWorkspace('WORKSPACE_SWITCH',`Switch from ${activeWorkspace} to ${n}`);activeWorkspace=n;const state=JSON.parse(localStorage.getItem(V5_KEY)||'{"workspaces":{},"auditLog":[]}');const w=state.workspaces?.[n];positions=w? w.positions.map(r=>({...r,track:trackFor(r),grade:gradeFor(Number(r.pc),trackFor(r)),family:familyFor(r.title||'')})):DB.positions.map(r=>({...r,track:trackFor(r),grade:gradeFor(r.pc,trackFor(r)),family:familyFor(r.title)}));state.activeWorkspace=n;state.workspaces=state.workspaces||{};state.workspaces[n]=state.workspaces[n]||{positions:positions.map(({track,grade,family,...r})=>r),updatedAt:new Date().toISOString()};state.auditLog=state.auditLog||[];state.auditLog.unshift({at:new Date().toISOString(),workspace:n,action:'WORKSPACE_OPEN',detail:'Workspace opened'});auditLog=state.auditLog;localStorage.setItem(V5_KEY,JSON.stringify(state));render()}
function resetWorkspace(){if(!confirm('Khôi phục workspace hiện tại về dữ liệu V4 baseline? Thao tác này thay thế dữ liệu hiện tại của workspace.'))return;positions=DB.positions.map(r=>({...r,track:trackFor(r),grade:gradeFor(r.pc,trackFor(r)),family:familyFor(r.title)}));saveWorkspace('RESTORE_BASELINE','Restored 81 source position records');render()}
loadWorkspace();

function filterTable(id,qid,did,pid){let q=(document.getElementById(qid)?.value||'').toLowerCase(),d=document.getElementById(did)?.value||'',p=document.getElementById(pid)?.value||'';document.querySelectorAll('#'+id+' tbody tr').forEach(tr=>tr.style.display=(!q||(tr.dataset.q||'').includes(q))&&(!d||tr.dataset.div===d)&&(!p||tr.dataset.pc===p)?'':'none')}
function downloadCSV(id,name){let rows=[...document.querySelectorAll('#'+id+' tr')].filter(tr=>tr.style.display!=='none').map(tr=>[...tr.children].map(td=>td.innerText.replace(/\s+/g,' ').trim()));let csv=rows.map(r=>r.map(x=>'"'+x.replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function render(){nav();let views={home,org,analysis,jd,evaluation,grading,career,family,mapping,development,success,data,governance,method};document.getElementById('app').innerHTML=(views[page]||home)()+`<div class="footer">V5 Development · V4 baseline preserved · browser-local prototype · PC results are displayed as provided · no Mercer score calculation is performed.</div>`}
render();
</script></body></html>
